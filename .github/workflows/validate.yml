name: Validate changes

on:
  pull_request:
  push:
    branches-ignore:
      - master
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Validate npm lockfile
        run: npm ci --dry-run --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Check formatting
        run: npx prettier --check .github/workflows/*.yml cspell.json public/projects.json

      - name: Spell check
        run: npx --yes cspell@8.17.5 --no-progress --config cspell.json "**/*.{md,json,ts,tsx,css,yml,yaml,jsonc}"

      - name: Run tests
        run: npm test -- --watchAll=false --passWithNoTests

      - name: Build site
        run: npm run build
