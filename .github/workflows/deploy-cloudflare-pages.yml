name: Deploy to Cloudflare Worker

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-release
  cancel-in-progress: true

jobs:
  upload-preview:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use matching npm version
        run: npm install -g npm@11.19.1

      - name: Validate npm lockfile
        run: npm ci --dry-run --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Upload version to staging
        run: npx wrangler versions upload --assets ./build --preview-alias staging --tag "$GITHUB_SHA" --message "Staging $GITHUB_SHA"

  promote-production:
    needs: upload-preview
    environment:
      name: production
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Promote reviewed version to production
        run: npx wrangler versions deploy --name portfolio --version-tag "$GITHUB_SHA@100" --yes --message "Production $GITHUB_SHA"
